<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея зображень</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }
        .card p {
            margin: 0;
            padding: 10px;
            font-size: 14px;
            color: #333;
        }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <h1>Галерея зображень</h1>
    <div class="grid">
        {% for file in files %}
        <div class="card">
            <img src="{{ url_for('static', filename='user_files2' + file.filename) }}" alt="{{ file.file_desc }}">
            <p>{{ file.file_desc }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
